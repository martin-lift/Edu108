<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Проверката трябва да може да се повтори.</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="54" width="216" height="148" rx="16" fill="#d9ebff"/><text x="132" y="112" font-size="27" font-weight="700">Условие</text><text x="132" y="157" font-size="22">Начална страница</text><path d="M 245 129 h 18 m -7 -7 l 7 7 -7 7" stroke="#365c85" stroke-width="3" fill="none"/><rect x="272" y="54" width="216" height="148" rx="16" fill="#dbf2e5"/><text x="380" y="112" font-size="27" font-weight="700">Действие</text><text x="380" y="157" font-size="22">Отвори График</text><path d="M 493 129 h 18 m -7 -7 l 7 7 -7 7" stroke="#365c85" stroke-width="3" fill="none"/><rect x="520" y="54" width="216" height="148" rx="16" fill="#fff0ce"/><text x="628" y="112" font-size="27" font-weight="700">Резултат</text><text x="628" y="157" font-size="22">Дата, час, място</text><text x="380" y="255" font-size="23">Проверката трябва да може да се повтори.</text></g></svg>