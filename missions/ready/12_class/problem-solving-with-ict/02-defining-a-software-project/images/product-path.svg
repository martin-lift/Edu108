<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Уточняване и повторни проверки при нужда.</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="44" width="216" height="158" rx="16" fill="#d9ebff"/><text x="132" y="104" font-size="25" font-weight="700">Изясняване</text><text x="132" y="155" font-size="22">Какво и защо?</text><rect x="272" y="44" width="216" height="158" rx="16" fill="#dbf2e5"/><text x="380" y="104" font-size="25" font-weight="700">Създаване</text><text x="380" y="155" font-size="22">Разработка и тест</text><rect x="520" y="44" width="216" height="158" rx="16" fill="#fff0ce"/><text x="628" y="104" font-size="25" font-weight="700">Използване</text><text x="628" y="155" font-size="22">Поддръжка</text><text x="380" y="253" font-size="24">Уточняване и повторни проверки при нужда.</text></g></svg>