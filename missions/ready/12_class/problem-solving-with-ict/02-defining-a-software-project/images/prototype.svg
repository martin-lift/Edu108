<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Ролята на прототипа зависи от обхвата</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="30" width="344" height="229" rx="16" fill="#d9ebff"/><rect x="392" y="30" width="344" height="229" rx="16" fill="#dbf2e5"/><text x="196" y="78" font-size="26" font-weight="700">Проект за прототип</text><text x="564" y="78" font-size="26" font-weight="700">Проект за система</text><text x="196" y="139" font-size="26">Прототипът може</text><text x="196" y="181" font-size="26">да е краен</text><text x="196" y="221" font-size="26">резултат.</text><text x="564" y="139" font-size="26">Прототипът може</text><text x="564" y="181" font-size="26">да е междинен</text><text x="564" y="221" font-size="26">резултат.</text></g></svg>