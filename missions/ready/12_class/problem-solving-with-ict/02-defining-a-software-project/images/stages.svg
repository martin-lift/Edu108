<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>От дефиниране до използване</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="25" width="216" height="100" rx="16" fill="#d9ebff"/><text x="132" y="63" font-size="21">1</text><text x="132" y="98" font-size="24" font-weight="700">Дефиниране</text><rect x="272" y="25" width="216" height="100" rx="16" fill="#d9ebff"/><text x="380" y="63" font-size="21">2</text><text x="380" y="98" font-size="24" font-weight="700">Планиране</text><rect x="520" y="25" width="216" height="100" rx="16" fill="#d9ebff"/><text x="628" y="63" font-size="21">3</text><text x="628" y="98" font-size="24" font-weight="700">Проектиране</text><rect x="24" y="153" width="216" height="100" rx="16" fill="#dbf2e5"/><text x="132" y="191" font-size="21">4</text><text x="132" y="226" font-size="24" font-weight="700">Разработване</text><rect x="272" y="153" width="216" height="100" rx="16" fill="#dbf2e5"/><text x="380" y="191" font-size="21">5</text><text x="380" y="226" font-size="24" font-weight="700">Проверка</text><rect x="520" y="153" width="216" height="100" rx="16" fill="#dbf2e5"/><text x="628" y="191" font-size="21">6</text><text x="628" y="226" font-size="24" font-weight="700">Използване</text><text x="380" y="289" font-size="21">При нужда се връщаме и уточняваме.</text></g></svg>