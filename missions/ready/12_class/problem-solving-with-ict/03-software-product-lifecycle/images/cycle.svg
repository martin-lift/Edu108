<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Жизненият цикъл продължава след първата версия</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="20" y="58" width="165" height="140" rx="16" fill="#d9ebff"/><text x="102" y="113" font-size="25" font-weight="700">Идея</text><text x="102" y="157" font-size="20">Потребност</text><rect x="205" y="58" width="165" height="140" rx="16" fill="#dbf2e5"/><text x="287" y="113" font-size="25" font-weight="700">Създаване</text><text x="287" y="157" font-size="20">Първа версия</text><rect x="390" y="58" width="165" height="140" rx="16" fill="#fff0ce"/><text x="472" y="113" font-size="25" font-weight="700">Употреба</text><text x="472" y="157" font-size="20">Поддръжка</text><rect x="575" y="58" width="165" height="140" rx="16" fill="#e9e1fb"/><text x="657" y="113" font-size="25" font-weight="700">Замяна</text><text x="657" y="157" font-size="20">Край на употреба</text><text x="380" y="252" font-size="24">Един продукт може да премине през няколко проекта.</text></g></svg>