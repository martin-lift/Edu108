<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Учебен модел с шест фази</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="20" y="15" width="225" height="116" rx="14" fill="#d9ebff"/><text x="132" y="42" font-size="19">1</text><text x="132" y="80" font-size="23" font-weight="700">Изследване и</text><text x="132" y="111" font-size="22">планиране</text><rect x="267" y="15" width="225" height="116" rx="14" fill="#d9ebff"/><text x="379" y="42" font-size="19">2</text><text x="379" y="80" font-size="23" font-weight="700">Анализ на</text><text x="379" y="111" font-size="22">осъществимостта</text><rect x="514" y="15" width="225" height="116" rx="14" fill="#d9ebff"/><text x="626" y="42" font-size="19">3</text><text x="626" y="80" font-size="23" font-weight="700">Проектиране</text><text x="626" y="111" font-size="22"></text><rect x="20" y="145" width="225" height="116" rx="14" fill="#dbf2e5"/><text x="132" y="172" font-size="19">4</text><text x="132" y="210" font-size="23" font-weight="700">Изпълнение</text><text x="132" y="241" font-size="22"></text><rect x="267" y="145" width="225" height="116" rx="14" fill="#dbf2e5"/><text x="379" y="172" font-size="19">5</text><text x="379" y="210" font-size="23" font-weight="700">Оценка</text><text x="379" y="241" font-size="22"></text><rect x="514" y="145" width="225" height="116" rx="14" fill="#dbf2e5"/><text x="626" y="172" font-size="19">6</text><text x="626" y="210" font-size="23" font-weight="700">Внедряване и</text><text x="626" y="241" font-size="22">използване</text><text x="380" y="291" font-size="20">Дейност → резултат → проверка</text></g></svg>