<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Изясняваме очакванията и подготвяме план.</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="40" width="216" height="160" rx="16" fill="#d9ebff"/><text x="132" y="101" font-size="25" font-weight="700">Потребност</text><text x="132" y="153" font-size="21">За кого и защо?</text><path d="M 244 125 h 21 m -8 -8 l 8 8 -8 8" fill="none" stroke="#446386" stroke-width="3"/><rect x="272" y="40" width="216" height="160" rx="16" fill="#dbf2e5"/><text x="380" y="101" font-size="25" font-weight="700">Изисквания</text><text x="380" y="153" font-size="21">Какво ще работи?</text><path d="M 492 125 h 21 m -8 -8 l 8 8 -8 8" fill="none" stroke="#446386" stroke-width="3"/><rect x="520" y="40" width="216" height="160" rx="16" fill="#fff0ce"/><text x="628" y="101" font-size="25" font-weight="700">План</text><text x="628" y="153" font-size="21">Задачи и ресурси</text><text x="380" y="250" font-size="23">Изясняваме очакванията и подготвяме план.</text></g></svg>