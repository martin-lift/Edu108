<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Конкретни данни и очакван резултат</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="35" y="38" width="690" height="130" rx="18" fill="#dbf2e5"/><text x="380" y="122" font-size="55" font-weight="700">5 + 7 + 8 = 20</text><text x="380" y="213" font-size="25">Очакван резултат ↔ действителен резултат</text><text x="380" y="260" font-size="23">Поправка → повторна проверка</text></g></svg>