<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Състоянието се подкрепя с доказателство.</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="24" y="40" width="216" height="160" rx="16" fill="#d9ebff"/><text x="132" y="100" font-size="25" font-weight="700">Цел</text><text x="132" y="152" font-size="21">Какво постигаме?</text><rect x="272" y="40" width="216" height="160" rx="16" fill="#dbf2e5"/><text x="380" y="100" font-size="25" font-weight="700">Контролна точка</text><text x="380" y="152" font-size="21">Приет резултат</text><rect x="520" y="40" width="216" height="160" rx="16" fill="#fff0ce"/><text x="628" y="100" font-size="25" font-weight="700">Доказателство</text><text x="628" y="152" font-size="21">Версия и проверка</text><text x="380" y="251" font-size="23">Състоянието се подкрепя с доказателство.</text></g></svg>