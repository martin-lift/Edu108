<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Три успешни проверки от пет</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><text x="380" y="105" font-size="55" font-weight="700">3 ÷ 5 × 100 = 60%</text><text x="380" y="174" font-size="28">Дял от този набор проверки</text><text x="380" y="232" font-size="24">Не е автоматично готовност на целия проект.</text></g></svg>