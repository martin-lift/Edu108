<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img"><title>Представяне според въпроса</title><rect width="760" height="300" rx="20" fill="#edf4fb"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17385e"><rect x="20" y="15" width="350" height="120" rx="15" fill="#d9ebff"/><text x="195" y="63" font-size="27" font-weight="700">Списък</text><text x="195" y="106" font-size="24">Какво предстои?</text><rect x="390" y="15" width="350" height="120" rx="15" fill="#dbf2e5"/><text x="565" y="63" font-size="27" font-weight="700">Гант</text><text x="565" y="106" font-size="24">Кога и колко време?</text><rect x="20" y="152" width="350" height="120" rx="15" fill="#d9ebff"/><text x="195" y="200" font-size="27" font-weight="700">Табло</text><text x="195" y="243" font-size="24">В какво състояние?</text><rect x="390" y="152" width="350" height="120" rx="15" fill="#dbf2e5"/><text x="565" y="200" font-size="27" font-weight="700">Календар</text><text x="565" y="243" font-size="24">На коя дата?</text></g></svg>