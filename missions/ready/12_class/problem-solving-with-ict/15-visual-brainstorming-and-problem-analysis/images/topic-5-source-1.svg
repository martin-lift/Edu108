<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="fish-title fish-desc" style="display:block;min-width:700px;width:100%;height:auto">
<title id="fish-title">Примерна диаграма на Ишикава</title><desc id="fish-desc">Хора, процес, информация и техника са четири категории възможни причини за шест незавършени записвания от двадесет проби. Причините са хипотези.</desc>
<g fill="none" stroke="#155a95" stroke-width="3"><path d="M40 180H710M350 180L220 50M630 180L500 50M350 180L220 310M630 180L500 310M700 170L710 180L700 190"></path><rect x="710" y="130" width="195" height="100" rx="8"></rect></g>
<g font-family="system-ui, sans-serif" font-size="18" fill="#203047"><text x="80" y="36" font-weight="700">Хора</text><text x="340" y="36" font-weight="700">Процес</text><text x="55" y="340" font-weight="700">Информация</text><text x="340" y="340" font-weight="700">Техника</text><text x="40" y="85">Неясна цел?</text><text x="40" y="112">Нужда от помощ?</text><text x="310" y="85">Пропуснат избор?</text><text x="310" y="112">Няма потвърждение?</text><text x="35" y="255">Липсва срок?</text><text x="35" y="282">Неясни указания?</text><text x="335" y="255">Грешка във формата?</text><text x="335" y="282">Прекъсната връзка?</text><text x="727" y="165">6 незавършени</text><text x="727" y="192">записвания</text><text x="727" y="219">от 20 проби</text></g></svg>