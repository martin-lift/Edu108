<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img"><rect width="840" height="430" rx="18" fill="#edf5fc"/><rect x="22" y="20" width="796" height="120" rx="12" fill="white" stroke="#b9d0e4"/><circle cx="66" cy="80" r="23" fill="#215f8e"/><text x="66" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="white">1</text><text x="110" y="65" font-family="Arial,sans-serif" font-size="23" fill="#17385e">За O годишната енергия е 876 kWh.</text><rect x="22" y="155" width="796" height="120" rx="12" fill="white" stroke="#b9d0e4"/><circle cx="66" cy="215" r="23" fill="#215f8e"/><text x="66" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="white">2</text><text x="110" y="200" font-family="Arial,sans-serif" font-size="23" fill="#17385e">По известните позиции O е 5817, а C е 4080 у.е.</text><rect x="22" y="290" width="796" height="120" rx="12" fill="white" stroke="#b9d0e4"/><circle cx="66" cy="350" r="23" fill="#215f8e"/><text x="66" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="white">3</text><text x="110" y="335" font-family="Arial,sans-serif" font-size="23" fill="#17385e">При трафик 20 у.е. месечно C става 4440 у.е.</text></svg>