<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="title desc"><title id="title">План за материалите</title><desc id="desc">За всеки материал планираме предназначение, източник, отговорник и обновяване.</desc><rect width="760" height="382" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">План за материалите</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Текст</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Програма на срещите</text><text x="42" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Автор: редакторът</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Снимки</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Шест собствени кадъра</text><text x="410" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Автор: фотографът</text><rect x="24" y="222" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Проверка</text><text x="42" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Точност и актуалност</text><text x="42" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Разрешено използване</text><rect x="392" y="222" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Поддръжка</text><text x="410" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Отговорник за промените</text><text x="410" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Проверка преди събитие</text></svg>