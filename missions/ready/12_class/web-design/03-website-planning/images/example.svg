<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="title desc"><title id="title">Пример: фотографски клуб</title><desc id="desc">Всяко решение в примерния сайт служи на конкретна потребност.</desc><rect width="760" height="382" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">Пример: фотографски клуб</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Основна потребност</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Кога е следващата среща?</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Важна информация</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Дата и място на Начало</text><rect x="24" y="222" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Допълващи страници</text><text x="42" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">За клуба, Събития,</text><text x="42" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Галерия и Контакти</text><rect x="392" y="222" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Проверка</text><text x="410" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Посетител намира срещата</text><text x="410" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">без устно насочване</text></svg>