<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" role="img" aria-labelledby="title desc"><title id="title">Тема и цел</title><desc id="desc">Темата назовава областта; целта описва полезен резултат за посетителя.</desc><rect width="760" height="238" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">Тема и цел</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Тема: спортен клуб</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">За какво е сайтът?</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Цел: намери тренировка</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Кога, къде и как се участва?</text></svg>