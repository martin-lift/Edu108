<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="title desc"><title id="title">Планът свързва решенията</title><desc id="desc">Целта, аудиторията, съдържанието и ресурсите се събират в общ план.</desc><rect width="760" height="382" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">Планът свързва решенията</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">За кого и защо?</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Аудитория и потребност</text><text x="42" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Ясна цел на сайта</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Какво и как?</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Съдържание и функции</text><text x="410" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Изисквания и проверка</text><rect x="24" y="222" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">С какво и кога?</text><text x="42" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Хора, материали, средства</text><text x="42" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Задачи и срокове</text><rect x="392" y="222" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">Какъв е резултатът?</text><text x="410" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Кратко проектно задание</text><text x="410" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Основа за изграждането</text></svg>