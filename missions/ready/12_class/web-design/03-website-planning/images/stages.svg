<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" role="img" aria-labelledby="title desc"><title id="title">От идея до поддържан сайт</title><desc id="desc">Етапите имат логичен ред, но проверките могат да наложат връщане към по-ранно решение.</desc><rect width="760" height="526" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">От идея до поддържан сайт</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">1. Планиране</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Цел, аудитория, обхват</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">2. Проектиране</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Структура и външен вид</text><rect x="24" y="222" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">3. Изграждане</text><text x="42" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Страници и функции</text><rect x="392" y="222" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">4. Тестване</text><text x="410" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Проверки и поправки</text><rect x="24" y="366" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">5. Публикуване</text><text x="42" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Достъп за посетителите</text><rect x="392" y="366" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">6. Оптимизиране</text><text x="410" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Подобрения и поддръжка</text></svg>