<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" role="img" aria-labelledby="title desc"><title id="title">Пет опори на добрия план</title><desc id="desc">Цел, аудитория, съдържание и функции, ресурси и проверимо задание.</desc><rect width="760" height="382" rx="18" fill="#f8f5fb"/><text x="28" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#54316f">Пет опори на добрия план</text><rect x="24" y="78" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">1. Цел</text><text x="42" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Полезен резултат</text><rect x="392" y="78" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">2. Аудитория</text><text x="410" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Конкретни потребности</text><rect x="24" y="222" width="344" height="128" rx="12" fill="#eee5f5" stroke="#c9bed5"/><text x="42" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">3. Материали и функции</text><text x="42" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Нужното за посетителя</text><rect x="392" y="222" width="344" height="128" rx="12" fill="#e5f2f3" stroke="#c9bed5"/><text x="410" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#39264f">4–5. Ресурси и проверка</text><text x="410" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#29243a">Реалистично задание</text></svg>