<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="t"><title id="t">Какво да запомним?</title><rect width="760" height="540" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Формулирайте цел за конкретна</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">аудитория.</text><rect x="20" y="134" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Свържете всяка страница с потребност.</text><rect x="20" y="218" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Задайте функции и проверими</text><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">изисквания.</text><rect x="20" y="334" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Планирайте материали, отговорници и</text><text x="40" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">срокове.</text><rect x="20" y="450" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Проверете и запазете общото задание.</text></svg>