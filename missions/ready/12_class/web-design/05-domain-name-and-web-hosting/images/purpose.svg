<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-labelledby="t"><title id="t">За какво е този урок?</title><rect width="760" height="572" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. IP адресира мрежов интерфейс;</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">домейнът е йерархично име.</text><rect x="20" y="134" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. DNS свързва имената с информация за</text><text x="40" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">услугите.</text><rect x="20" y="250" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. URL посочва конкретен ресурс.</text><rect x="20" y="334" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Хостингът предоставя сайта; домейнът</text><text x="40" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">е отделен избор.</text><rect x="20" y="450" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Сравнявайте нужди, условия, поддръжка</text><text x="40" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">и общи разходи.</text></svg>