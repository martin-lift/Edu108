<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 508" role="img" aria-labelledby="t"><title id="t">Проектиране на началната страница</title><rect width="760" height="508" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Начална страница</text><rect x="20" y="102" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Какво трябва да показва началната</text><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">страница</text><rect x="20" y="218" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Обновяване на началната страница</text><rect x="20" y="302" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Дизайн на началната страница</text><rect x="20" y="386" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Задача: схематичен дизайн на начална</text><text x="40" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">страница</text></svg>