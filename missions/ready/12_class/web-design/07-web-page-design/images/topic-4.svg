<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="t"><title id="t">Вътрешни страници и връзки</title><rect width="760" height="476" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Вътрешните страници</text><rect x="20" y="102" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Съдържание на вътрешните страници</text><rect x="20" y="186" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Връзки във вътрешните страници</text><rect x="20" y="270" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Графична или текстова навигация</text><rect x="20" y="354" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Задача: схематичен дизайн на вътрешна</text><text x="40" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">страница</text></svg>