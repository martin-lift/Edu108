<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="t"><title id="t">Качество, поддръжка и дизайн системи</title><rect width="760" height="476" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Стандартите улесняват поддръжката</text><rect x="20" y="102" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Стандартите подобряват</text><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">използваемостта</text><rect x="20" y="218" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Стандартите означават качество</text><rect x="20" y="302" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Организационни стандарти</text><rect x="20" y="386" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Защо да спазваме стандартите</text></svg>