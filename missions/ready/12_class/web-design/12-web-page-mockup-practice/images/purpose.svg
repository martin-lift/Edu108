<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="t"><title id="t">За какво е този урок?</title><rect width="760" height="540" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Организирайте основните области в</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">отделни слоеве.</text><rect x="20" y="134" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Използвайте реалистични текстове и</text><text x="40" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">разрешени изображения.</text><rect x="20" y="250" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Подравнявайте и пазете пропорциите.</text><rect x="20" y="334" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Подгответе и проверете тесен вариант.</text><rect x="20" y="418" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="451" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Запазете редактируемите модели и</text><text x="40" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">готовите изображения.</text></svg>