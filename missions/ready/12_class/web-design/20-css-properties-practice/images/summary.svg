<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" role="img" aria-labelledby="t"><title id="t">Какво да запомним?</title><rect width="760" height="604" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Content, padding, border и margin</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">имат различни роли.</text><rect x="20" y="134" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. При border-box зададената ширина</text><text x="40" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">включва padding и border.</text><rect x="20" y="250" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Float позволява обтичане; flex и grid</text><text x="40" y="315" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">подреждат области.</text><rect x="20" y="366" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Текстът и фонът се проверяват за</text><text x="40" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">четимост заедно.</text><rect x="20" y="482" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Шрифтът изисква кирилица, резервно</text><text x="40" y="547" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">семейство и право за ползване.</text></svg>