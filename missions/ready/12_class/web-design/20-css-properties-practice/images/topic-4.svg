<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" role="img" aria-labelledby="t"><title id="t">Цвят и изображение за фон</title><rect width="760" height="444" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Форматиране на фон</text><rect x="20" y="102" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Изображение като фон</text><rect x="20" y="186" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Повторение на фоновото изображение</text><rect x="20" y="270" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Фиксиран и превъртащ се фон</text><rect x="20" y="354" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="387" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Позиция на фоновото изображение</text></svg>