<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t"><title id="t">Оформете две карти в две теми</title><rect width="760" height="340" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Редактирайте един самостоятелен HTML</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">файл</text><rect x="20" y="134" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Проверете всички зададени случаи</text><rect x="20" y="218" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Запазете, отворете повторно и</text><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">предайте</text></svg>