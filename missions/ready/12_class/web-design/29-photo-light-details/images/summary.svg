<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-labelledby="t"><title id="t">Какво да запомним?</title><rect width="760" height="572" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Посоката и характерът на светлината</text><text x="40" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">променят видимите детайли.</text><rect x="20" y="134" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Белият лист може да върне светлина</text><text x="40" y="199" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">към сенките.</text><rect x="20" y="250" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Фонът трябва да помага на посланието.</text><rect x="20" y="334" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Проверяваме фокус, отражения, сенки и</text><text x="40" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">краища.</text><rect x="20" y="450" width="720" height="104" rx="10" fill="#eee5f5"/><text x="40" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Променяме един фактор и сравняваме</text><text x="40" y="515" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">повторния кадър.</text></svg>