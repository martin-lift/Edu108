<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="t"><title id="t">Собствени фотографии в реална страница</title><rect width="760" height="476" rx="16" fill="#f8f5fb"/><rect x="20" y="18" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">1. Приложете към собствените фотографии</text><rect x="20" y="102" width="720" height="72" rx="10" fill="#e5f2f3"/><text x="40" y="135" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">2. Размери и изрязване според мястото</text><rect x="20" y="186" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">3. Формат и компресия</text><rect x="20" y="270" width="720" height="104" rx="10" fill="#e5f2f3"/><text x="40" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">4. Име, алтернативен текст и проверка в</text><text x="40" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">страницата</text><rect x="20" y="386" width="720" height="72" rx="10" fill="#eee5f5"/><text x="40" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#39264f">5. Практическа задача</text></svg>