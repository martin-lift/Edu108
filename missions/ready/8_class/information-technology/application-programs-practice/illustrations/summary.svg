<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="744" viewBox="0 0 1100 744"><rect width="1100" height="744" rx="20" fill="#f2f7fb"/><text x="550" y="42" text-anchor="middle" fill="#20354c" font-size="27" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Проследи примера</tspan></text><rect x="35" y="100" width="1030" height="67" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 114Q35 10049 100H350V167H49Q35 16735 153Z" fill="#e2eefb"/><text x="55" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">1</tspan></text><text x="375" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Търсим помощ според приложението и задачата.</tspan></text><rect x="35" y="187" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 201Q35 18749 187H350V285H49Q35 28535 271Z" fill="#e2f4eb"/><text x="55" y="221" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">2</tspan></text><text x="375" y="221" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Сравняваме архиви с еднакво съдържание.</tspan><tspan x="375" dy="31.05">Резултатите важат за дадените данни и настройки.</tspan></text><rect x="35" y="305" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 319Q35 30549 305H350V403H49Q35 40335 389Z" fill="#fff0d1"/><text x="55" y="339" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">3</tspan></text><text x="375" y="339" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Избираме файловете по правилния тип и пазим</tspan><tspan x="375" dy="31.05">предишните резултати.</tspan></text><rect x="35" y="423" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 437Q35 42349 423H350V521H49Q35 52135 507Z" fill="#e2eefb"/><text x="55" y="457" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">4</tspan></text><text x="375" y="457" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Проверяваме имена, брой и подпапки, а не само</tspan><tspan x="375" dy="31.05">размер.</tspan></text><rect x="35" y="541" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 555Q35 54149 541H350V639H49Q35 63935 625Z" fill="#e2f4eb"/><text x="55" y="575" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">5</tspan></text><text x="375" y="575" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Качване и споделяне са различни действия.</tspan><tspan x="375" dy="31.05">Проверяваме достъпа.</tspan></text><text x="550" y="716" text-anchor="middle" fill="#52687d" font-size="20" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Готов учебен пример</tspan></text></svg>