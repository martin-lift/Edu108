<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="806" viewBox="0 0 1100 806"><rect width="1100" height="806" rx="20" fill="#f2f7fb"/><text x="550" y="42" text-anchor="middle" fill="#20354c" font-size="27" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Проследи примера</tspan></text><rect x="35" y="100" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 114Q35 10049 100H350V198H49Q35 19835 184Z" fill="#e2eefb"/><text x="55" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">1</tspan></text><text x="375" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Архивът събира файлове, а резервното копие служи</tspan><tspan x="375" dy="31.05">за възстановяване.</tspan></text><rect x="35" y="218" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 232Q35 21849 218H350V316H49Q35 31635 302Z" fill="#e2f4eb"/><text x="55" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">2</tspan></text><text x="375" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Извличането поставя съдържанието в избрана</tspan><tspan x="375" dy="31.05">папка.</tspan></text><rect x="35" y="336" width="1030" height="129" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 350Q35 33649 336H350V465H49Q35 46535 451Z" fill="#fff0d1"/><text x="55" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">3</tspan></text><text x="375" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Компресията без загуба възстановява точно</tspan><tspan x="375" dy="31.05">данните; със загуба премахва част от</tspan><tspan x="375" dy="31.05">информацията.</tspan></text><rect x="35" y="485" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 499Q35 48549 485H350V583H49Q35 58335 569Z" fill="#e2eefb"/><text x="55" y="519" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">4</tspan></text><text x="375" y="519" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Форматът и настройките имат значение. Различните</tspan><tspan x="375" dy="31.05">файлове не се свиват еднакво.</tspan></text><rect x="35" y="603" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 617Q35 60349 603H350V701H49Q35 70135 687Z" fill="#e2f4eb"/><text x="55" y="637" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">5</tspan></text><text x="375" y="637" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Проверяваме съдържанието и пазим отделни</tspan><tspan x="375" dy="31.05">оригинали и резултати.</tspan></text><text x="550" y="778" text-anchor="middle" fill="#52687d" font-size="20" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Готов учебен пример</tspan></text></svg>