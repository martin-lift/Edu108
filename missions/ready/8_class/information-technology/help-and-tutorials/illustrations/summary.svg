<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="713" viewBox="0 0 1100 713"><rect width="1100" height="713" rx="20" fill="#f2f7fb"/><text x="550" y="42" text-anchor="middle" fill="#20354c" font-size="27" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Проследи примера</tspan></text><rect x="35" y="100" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 114Q35 10049 100H350V198H49Q35 19835 184Z" fill="#e2eefb"/><text x="55" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">1</tspan></text><text x="375" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Самоучителят води през поредица от действия към</tspan><tspan x="375" dy="31.05">резултат.</tspan></text><rect x="35" y="218" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 232Q35 21849 218H350V316H49Q35 31635 302Z" fill="#e2f4eb"/><text x="55" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">2</tspan></text><text x="375" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Помощната система обяснява функции и команди. Тя</tspan><tspan x="375" dy="31.05">може да е вградена или онлайн.</tspan></text><rect x="35" y="336" width="1030" height="67" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 350Q35 33649 336H350V403H49Q35 40335 389Z" fill="#fff0d1"/><text x="55" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">3</tspan></text><text x="375" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Търсим по конкретна задача и подходяща версия.</tspan></text><rect x="35" y="423" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 437Q35 42349 423H350V521H49Q35 52135 507Z" fill="#e2eefb"/><text x="55" y="457" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">4</tspan></text><text x="375" y="457" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Избираме тема според приложението и обекта.</tspan><tspan x="375" dy="31.05">Текст и клетка имат различни настройки.</tspan></text><rect x="35" y="541" width="1030" height="67" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 555Q35 54149 541H350V608H49Q35 60835 594Z" fill="#e2f4eb"/><text x="55" y="575" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">5</tspan></text><text x="375" y="575" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Проверяваме готовия резултат и пазим оригинала.</tspan></text><text x="550" y="685" text-anchor="middle" fill="#52687d" font-size="20" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Готов учебен пример</tspan></text></svg>