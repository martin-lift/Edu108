<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">Програма и данни в обща памет</text><path d="M480 220 L480 310" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="480" cy="310" r="6" fill="#df9432"/><text x="480.0" y="255.0" text-anchor="middle" font-size="17">извличане / запис</text><path d="M225 365 L300 365" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="300" cy="365" r="6" fill="#df9432"/><text x="262.5" y="355.0" text-anchor="middle" font-size="17"></text><path d="M670 365 L750 365" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="750" cy="365" r="6" fill="#df9432"/><text x="710.0" y="355.0" text-anchor="middle" font-size="17"></text><rect x="300" y="75" width="370" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="316" y="105" font-size="22" font-weight="bold">ПАМЕТ</text><text x="316" y="135" font-size="19">Инструкции: зареди, събери, запиши</text><text x="316" y="162" font-size="19">Данни: 7, 5, …</text><text x="316" y="189" font-size="19">Резултат: 12</text><rect x="300" y="310" width="370" height="120" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="316" y="340" font-size="22" font-weight="bold">ПРОЦЕСОР</text><text x="316" y="370" font-size="19">Управление + АЛУ + регистри</text><rect x="25" y="310" width="200" height="120" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="41" y="340" font-size="22" font-weight="bold">ВХОД</text><text x="41" y="370" font-size="19">Клавиатура</text><text x="41" y="397" font-size="19">Въвеждаш: 7 и 5</text><rect x="750" y="310" width="190" height="120" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="766" y="340" font-size="22" font-weight="bold">ИЗХОД</text><text x="766" y="370" font-size="19">Екран</text><text x="766" y="397" font-size="19">Виждаш: 12</text><text x="35" y="478" font-size="18">Линиите показват обмен, а не физическото разположение на частите.</text><text x="35" y="504" font-size="18">Същата система изпълнява друга задача, когато заредим друга програма.</text></g></svg>