<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">Един байт: осем позиции, две възможности във всяка</text><rect x="35" y="90" width="890" height="100" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="51" y="120" font-size="22" font-weight="bold">0     0     0     0     0     1     0     1</text><text x="51" y="150" font-size="19">Двоичният запис 00000101 представя числото 5.</text><rect x="35" y="270" width="410" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="51" y="300" font-size="22" font-weight="bold">Капацитет</text><text x="51" y="330" font-size="19">Колко данни се побират?</text><text x="51" y="357" font-size="19">Пример: 8 GB или 16 GB RAM</text><rect x="500" y="270" width="425" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="516" y="300" font-size="22" font-weight="bold">Скорост на пренос</text><text x="516" y="330" font-size="19">Колко данни се пренасят за време?</text><text x="516" y="357" font-size="19">Пример: GB/s</text><text x="35" y="478" font-size="18">8 бита = 1 байт. Осем бита дават 256 различни комбинации.</text><text x="35" y="504" font-size="18">Повече място не означава автоматично по-бърз достъп.</text></g></svg>