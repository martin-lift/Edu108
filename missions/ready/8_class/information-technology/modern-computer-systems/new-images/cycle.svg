<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">Една инструкция за събиране: проследи стойностите</text><path d="M305 150 L350 150" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="350" cy="150" r="6" fill="#df9432"/><text x="335.5" y="140.0" font-size="17"></text><path d="M600 150 L650 150" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="650" cy="150" r="6" fill="#df9432"/><text x="633.0" y="140.0" font-size="17"></text><path d="M790 225 L670 350" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="670" cy="350" r="6" fill="#df9432"/><text x="738.0" y="277.5" font-size="17">резултат</text><rect x="25" y="80" width="280" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="41" y="110" font-size="22" font-weight="bold">1. Извлечи и разчети</text><text x="41" y="140" font-size="19">Инструкция: СЪБЕРИ</text><text x="41" y="167" font-size="19">Операнди: R1 и R2</text><rect x="350" y="80" width="250" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="366" y="110" font-size="22" font-weight="bold">2. Подготви данните</text><text x="366" y="140" font-size="19">Регистър R1 = 7</text><text x="366" y="167" font-size="19">Регистър R2 = 5</text><rect x="650" y="80" width="285" height="145" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="666" y="110" font-size="22" font-weight="bold">3. Изпълни в АЛУ</text><text x="666" y="140" font-size="19">7 + 5 = 12</text><rect x="350" y="315" width="320" height="115" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="366" y="345" font-size="22" font-weight="bold">4. Запиши резултата</text><text x="366" y="375" font-size="19">Регистър R3 = 12</text><text x="35" y="478" font-size="18">Това е учебен модел; имената на инструкциите зависят от процесора.</text><text x="35" y="504" font-size="18">Следваща инструкция може да запише резултата в RAM или да го използва.</text></g></svg>