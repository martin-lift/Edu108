<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">Как повече електроника се побира в по-малко място</text><path d="M305 230 L343 230" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="343" cy="230" r="6" fill="#df9432"/><text x="332.0" y="220.0" font-size="17"></text><path d="M618 230 L655 230" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="655" cy="230" r="6" fill="#df9432"/><text x="644.5" y="220.0" font-size="17"></text><rect x="30" y="90" width="275" height="290" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="46" y="120" font-size="22" font-weight="bold">ЛАМПИ</text><text x="46" y="150" font-size="19">Електронно превключване</text><text x="46" y="177" font-size="19">Големи корпуси</text><text x="46" y="204" font-size="19">Много топлина</text><rect x="343" y="90" width="275" height="290" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="359" y="120" font-size="22" font-weight="bold">ТРАНЗИСТОРИ</text><text x="359" y="150" font-size="19">Полупроводникови елементи</text><text x="359" y="177" font-size="19">По-малки размери</text><text x="359" y="204" font-size="19">По-нисък разход</text><rect x="655" y="90" width="275" height="290" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="671" y="120" font-size="22" font-weight="bold">ИНТЕГРАЛНИ СХЕМИ</text><text x="671" y="150" font-size="19">Много елементи в чип</text><text x="671" y="177" font-size="19">По-къси връзки</text><text x="671" y="204" font-size="19">Висока интеграция</text><text x="35" y="478" font-size="18">Микропроцесорът събира основните функции на CPU в интегрална схема.</text><text x="35" y="504" font-size="18">Реалните поколения се застъпват; годините са ориентири.</text></g></svg>