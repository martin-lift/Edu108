<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">От отварянето на документ до записването му</text><path d="M270 160 L355 160" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="355" cy="160" r="6" fill="#df9432"/><text x="320.5" y="150.0" font-size="17">отвори</text><path d="M605 190 L690 190" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="690" cy="190" r="6" fill="#df9432"/><text x="655.5" y="180.0" font-size="17">обмен</text><path d="M355 300 L270 300" stroke="#df9432" stroke-width="4" fill="none"/><circle cx="270" cy="300" r="6" fill="#df9432"/><text x="320.5" y="290.0" font-size="17">запиши</text><rect x="25" y="100" width="245" height="245" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="41" y="130" font-size="22" font-weight="bold">SSD / диск</text><text x="41" y="160" font-size="19">Записан файл</text><text x="41" y="187" font-size="19">Доклад: версия А</text><text x="41" y="214" font-size="19">Остава без ток</text><rect x="355" y="100" width="250" height="245" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="371" y="130" font-size="22" font-weight="bold">RAM</text><text x="371" y="160" font-size="19">Работно копие</text><text x="371" y="187" font-size="19">Редакции: версия Б</text><text x="371" y="214" font-size="19">Губи се без ток</text><rect x="690" y="100" width="245" height="245" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="706" y="130" font-size="22" font-weight="bold">CPU и кеш</text><text x="706" y="160" font-size="19">Изпълнява редактора</text><text x="706" y="187" font-size="19">Обработва промени</text><text x="706" y="214" font-size="19">Кеш: бързи копия</text><text x="35" y="478" font-size="18">Преди „Запиши“ SSD може още да съдържа старата версия А.</text><text x="35" y="504" font-size="18">След успешен запис файлът на SSD съдържа новата версия Б.</text></g></svg>