<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f1f6fa"/><g font-family="Arial,sans-serif" fill="#183247"><text x="35" y="42" font-size="25" font-weight="bold">Една характеристика не разказва цялата история</text><rect x="30" y="90" width="420" height="290" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="46" y="120" font-size="22" font-weight="bold">Компютър А</text><text x="46" y="150" font-size="19">Еднакъв модел CPU</text><text x="46" y="177" font-size="19">8 GB RAM</text><text x="46" y="204" font-size="19">512 GB SSD</text><text x="46" y="231" font-size="19">Същата операционна система</text><rect x="510" y="90" width="420" height="290" rx="12" fill="white" stroke="#26778b" stroke-width="2"/><text x="526" y="120" font-size="22" font-weight="bold">Компютър Б</text><text x="526" y="150" font-size="19">Еднакъв модел CPU</text><text x="526" y="177" font-size="19">16 GB RAM</text><text x="526" y="204" font-size="19">512 GB SSD</text><text x="526" y="231" font-size="19">Същата операционна система</text><text x="35" y="478" font-size="18">При работни данни над 8 GB компютър Б има повече свободна RAM.</text><text x="35" y="504" font-size="18">При малък документ разликата може да е незабележима.</text></g></svg>