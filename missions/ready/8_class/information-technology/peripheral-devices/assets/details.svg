ве на драйвера:</tspan><tspan x="832.5" dy="35.1">disk.sys</tspan><tspan x="832.5" dy="35.1">partmgr.sys</tspan></text><text x="550" y="628" font-family="Arial,Segoe UI,sans-serif" font-size="24" fill="#20354c" text-anchor="middle"><tspan x="550" dy="0">Версията описва софтуера, а не обема на паметта.</tspan><tspan x="550" dy="32.400000000000006">Файловете на драйвера са различни от личните документи.</tspan></text></svg>