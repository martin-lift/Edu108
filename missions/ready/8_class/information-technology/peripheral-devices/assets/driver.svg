<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710"><rect width="1100" height="710" rx="20" fill="#f2f7fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#207e94"/></marker></defs><text x="550" y="55" font-family="Arial,Segoe UI,sans-serif" font-size="28" fill="#20354c" text-anchor="middle"><tspan x="550" dy="0">КАБЕЛЪТ И ДРАЙВЕРЪТ ИМАТ РАЗЛИЧНИ РОЛИ</tspan></text><rect x="60" y="115" width="450" height="120" rx="16" fill="#e2eefc" stroke="#a8c4d5" stroke-width="2"/><text x="285.0" y="168.05" font-family="Arial,Segoe UI,sans-serif" font-size="23" fill="#20354c" text-anchor="middle"><tspan x="285.0" dy="0">Драйвер</tspan><tspan x="285.0" dy="31.05">Програма в операционната система</tspan></text><rect x="590" y="115" width="450" height="120" rx="16" fill="#fff0d3" stroke="#a8c4d5" stroke-width="2"/><text x="815.0" y="168.05" font-family="Arial,Segoe UI,sans-serif" font-size="23" fill="#20354c" text-anchor="middle"><tspan x="815.0" dy="0">Контролер</tspan><tspan x="815.0" dy="31.05">Електронна част на хардуера</tspan></text><path d="M530 175L570 175" stroke="#207e94" stroke-width="4" marker-end="url(#a)"/><rect x="60" y="330" width="450" height="120" rx="16" fill="#fff" stroke="#a8c4d5" stroke-width="2"/><text x="285.0" y="382.4" font-family="Arial,Segoe UI,sans-serif" font-size="24" fill="#20354c" text-anchor="middle"><tspan x="285.0" dy="0">Порт и кабел</tspan><tspan x="285.0" dy="32.400000000000006">Физическа връзка</tspan></text><rect x="590" y="330" width="450" height="120" rx="16" fill="#e4f3eb" stroke="#a8c4d5" stroke-width="2"/><text x="815.0" y="383.05" font-family="Arial,Segoe UI,sans-serif" font-size="23" fill="#20354c" text-anchor="middle"><tspan x="815.0" dy="0">Принтер</tspan><tspan x="815.0" dy="31.05">Извежда информация на хартия</tspan></text><text x="550" y="535" font-family="Arial,Segoe UI,sans-serif" font-size="26" fill="#20354c" text-anchor="middle"><tspan x="550" dy="0">За работа са нужни съвместими устройство, връзка и софтуер.</tspan></text><text x="550" y="603" font-family="Arial,Segoe UI,sans-serif" font-size="28" fill="#20354c" text-anchor="middle"><tspan x="550" dy="0">Драйвер ≠ кабел</tspan><tspan x="550" dy="37.800000000000004">Драйвер ≠ контролер</tspan></text></svg>