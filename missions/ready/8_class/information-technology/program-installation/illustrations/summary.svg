<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="806" viewBox="0 0 1100 806"><rect width="1100" height="806" rx="20" fill="#f2f7fb"/><text x="550" y="42" text-anchor="middle" fill="#20354c" font-size="27" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Проследи примера</tspan></text><rect x="35" y="100" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 114Q35 10049 100H350V198H49Q35 19835 184Z" fill="#e2eefb"/><text x="55" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">1</tspan></text><text x="375" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Избираме софтуер според задачата, лиценза и</tspan><tspan x="375" dy="31.05">съвместимостта.</tspan></text><rect x="35" y="218" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 232Q35 21849 218H350V316H49Q35 31635 302Z" fill="#e2f4eb"/><text x="55" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">2</tspan></text><text x="375" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Свободен и безплатен не означават едно и също.</tspan><tspan x="375" dy="31.05">Пробните версии могат да имат ограничения.</tspan></text><rect x="35" y="336" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 350Q35 33649 336H350V434H49Q35 43435 420Z" fill="#fff0d1"/><text x="55" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">3</tspan></text><text x="375" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Инсталацията подготвя файлове и настройки.</tspan><tspan x="375" dy="31.05">Деинсталацията премахва програмата.</tspan></text><rect x="35" y="454" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 468Q35 45449 454H350V552H49Q35 55235 538Z" fill="#e2eefb"/><text x="55" y="488" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">4</tspan></text><text x="375" y="488" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Диспечерът на устройства показва хардуера.</tspan><tspan x="375" dy="31.05">Наблюдението само по себе си не е диагноза.</tspan></text><rect x="35" y="572" width="1030" height="129" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 586Q35 57249 572H350V701H49Q35 70135 687Z" fill="#e2f4eb"/><text x="55" y="606" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">5</tspan></text><text x="375" y="606" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">End Task спира работеща задача. То не</tspan><tspan x="375" dy="31.05">деинсталира приложението и може да загуби</tspan><tspan x="375" dy="31.05">незапазената работа.</tspan></text><text x="550" y="778" text-anchor="middle" fill="#52687d" font-size="20" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Готов учебен пример</tspan></text></svg>