<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="539" viewBox="0 0 1100 539"><rect width="1100" height="539" rx="20" fill="#f2f7fb"/><text x="550" y="42" text-anchor="middle" fill="#20354c" font-size="27" font-family="Arial,Segoe UI,sans-serif"><tspan x="550" dy="0">Проследи примера</tspan></text><rect x="35" y="100" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 114Q35 10049 100H350V198H49Q35 19835 184Z" fill="#e2eefb"/><text x="55" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">Тема</tspan></text><text x="375" y="134" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Създаване и интегриране на компонентите на сайт</tspan><tspan x="375" dy="31.05">— упражнение</tspan></text><rect x="35" y="218" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 232Q35 21849 218H350V316H49Q35 31635 302Z" fill="#e2f4eb"/><text x="55" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">Как ще учим</tspan></text><text x="375" y="252" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Разглеждаме обяснения, ситуации и готови</tspan><tspan x="375" dy="31.05">примери.</tspan></text><rect x="35" y="336" width="1030" height="98" rx="14" fill="white" stroke="#b4cbd9"/><path d="M35 350Q35 33649 336H350V434H49Q35 43435 420Z" fill="#fff0d1"/><text x="55" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="55" dy="0">Резултат</tspan></text><text x="375" y="370" text-anchor="start" fill="#20354c" font-size="23" font-family="Arial,Segoe UI,sans-serif"><tspan x="375" dy="0">Обясняваме решенията със свои думи и проверяваме</tspan><tspan x="375" dy="31.05">разбирането.</tspan></text><text x="550" y="511" text-anchor="midd